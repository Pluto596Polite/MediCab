# Builds MediCab and runs the unit tests on every push to main and every pull
# request. The release variant is built too (unsigned, since the signing key
# never leaves the maintainer's Mac) so R8 shrinking problems show up here.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "store-listing/**", "licenses/**"]
  pull_request:
    paths-ignore: ["**.md", "store-listing/**", "licenses/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and checks the wrapper jar hasn't been tampered with.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 14
