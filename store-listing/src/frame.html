<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:Fredoka;color:#fff;background:var(--bg,#2F6BFF)}
.ring{position:absolute;border-radius:50%;border:90px solid #fff;opacity:.08;width:760px;height:760px;left:-330px;top:-300px}
.blob{position:absolute;border-radius:50%;background:#fff;opacity:.08;width:520px;height:520px;right:-200px;bottom:240px}
h1{position:absolute;left:70px;right:70px;top:110px;font-weight:700;font-size:92px;line-height:1.05;text-shadow:0 7px 0 #111214}
p{position:absolute;left:72px;right:72px;top:338px;font-family:Nunito;font-weight:900;font-size:40px;line-height:1.25}
.phone{position:absolute;left:50%;top:520px;width:700px;height:1556px;margin-left:-350px;border:14px solid #111214;border-radius:72px;overflow:hidden;background:#111214;box-shadow:0 18px 0 #111214}
/* Trim the status bar: the frame's rounded corner would clip its clock. */
.phone img{display:block;width:100%;height:auto;margin-top:-50px}
</style></head><body>
<div class="ring"></div><div class="blob"></div>
<h1 id="t"></h1><p id="s"></p>
<div class="phone"><img id="img"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('t').textContent=q.get('t');
document.getElementById('s').textContent=q.get('s');
document.getElementById('img').src='raw/'+q.get('img')+'.png';
document.body.style.setProperty('--bg', q.get('bg')||'#2F6BFF');
</script></body></html>
